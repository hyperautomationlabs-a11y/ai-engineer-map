name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly link check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check          # unknown prerequisites / cycles fail the build
      - run: npm run check-links    # 404s fail; bot-blocking 403s are reported only
      - run: node scripts/build-site.mjs
